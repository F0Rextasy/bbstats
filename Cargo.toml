[package]
name = "bbstats"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
build = "build.rs"
description = "Dynamic Island background process & developer project telemetry monitor"
license = "MIT"
repository = "https://github.com/F0Rextasy/bbstats"
readme = "README.md"
keywords = ["process-monitor", "dynamic-island", "developer-tools", "dev-dashboard"]
categories = ["gui", "command-line-utilities", "development-tools"]

[features]
default = []
screenshots = ["dep:miniz_oxide"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
miniz_oxide = { version = "0.8", optional = true, default-features = false, features = ["with-alloc"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Foundation",
    "Foundation_Numerics",
    "Graphics_DirectX",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "UI_ViewManagement",
]

[target.'cfg(windows)'.dependencies.windows-core]
version = "0.58"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

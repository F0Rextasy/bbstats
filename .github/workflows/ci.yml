name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build, Clippy & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Unit Tests
        run: cargo test --all-features --no-fail-fast --locked
      - name: Release Build & Smoke CLI
        shell: pwsh
        run: |
          cargo build --release --locked
          .\target\release\bbstats.exe --version
          .\target\release\bbstats.exe port 59999

  macos:
    name: Build, Clippy & Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Unit Tests
        run: cargo test --all-features --no-fail-fast --locked
      - name: Release Build & Smoke CLI
        run: |
          cargo build --release --locked
          ./target/release/bbstats --version
          ./target/release/bbstats --status

  linux:
    name: Build, Clippy & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Unit Tests
        run: cargo test --all-features --no-fail-fast --locked
      - name: Release Build & Smoke CLI
        run: |
          cargo build --release --locked
          ./target/release/bbstats --version
          ./target/release/bbstats --status

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    name: Build Release (Windows x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Tests
        run: cargo test --all-features --no-fail-fast --locked
      - name: Build Release Binary
        run: cargo build --release --locked
      - name: Stage Release Archive
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $stage = "dist\bbstats-$tag-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target\release\bbstats.exe $stage\
          Copy-Item README.md, README.tr.md, CHANGELOG.md, LICENSE $stage\
          Copy-Item assets\labels.example.toml $stage\
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\bbstats-$tag-windows-x86_64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x86_64
          path: dist/*.zip

  build-macos:
    name: Build Release (macOS ${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Run Native Tests
        if: matrix.arch == 'arm64'
        run: cargo test --all-features --no-fail-fast --locked
      - name: Build Release Binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage Release Archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="dist/bbstats-${TAG}-macos-${{ matrix.arch }}"
          mkdir -p "${STAGE}"
          cp "target/${{ matrix.target }}/release/bbstats" "${STAGE}/"
          cp README.md README.tr.md CHANGELOG.md LICENSE "${STAGE}/"
          cp assets/labels.example.toml "${STAGE}/"
          tar -C dist -czf "dist/bbstats-${TAG}-macos-${{ matrix.arch }}.tar.gz" "bbstats-${TAG}-macos-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos-${{ matrix.arch }}
          path: dist/*.tar.gz

  build-linux:
    name: Build Release (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Tests
        run: cargo test --all-features --no-fail-fast --locked
      - name: Build Release Binary
        run: cargo build --release --locked
      - name: Stage Release Archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE="dist/bbstats-${TAG}-linux-x86_64"
          mkdir -p "${STAGE}"
          cp target/release/bbstats "${STAGE}/"
          cp README.md README.tr.md CHANGELOG.md LICENSE "${STAGE}/"
          cp assets/labels.example.toml "${STAGE}/"
          tar -C dist -czf "dist/bbstats-${TAG}-linux-x86_64.tar.gz" "bbstats-${TAG}-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x86_64
          path: dist/*.tar.gz

  publish:
    name: Verify Checksums, Attest & Publish Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate Unified SHA256SUMS.txt
        run: |
          cd artifacts
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/*.zip
            artifacts/*.tar.gz
      - name: Upload GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
